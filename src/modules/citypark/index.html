<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidsTown City Park: Your Big Journey</title>
<style>
  body {
    font-family: Georgia, serif;
    background: #F5F5DC;
    color: #000;
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1.25rem 3rem;
    font-size: 1.15rem;
    line-height: 1.5;
  }
  h1 { text-align: center; }
  hr { margin: 1.5rem 0; }
  img { max-width: 100%; height: auto; }
  #intro input[type="text"] {
    font-size: 1rem;
    padding: 0.4rem;
    margin-right: 0.5rem;
  }
  button, .choice-btn {
    font-size: 1rem;
    padding: 0.5rem 1rem;
    margin: 0.35rem 0.5rem 0.35rem 0;
    cursor: pointer;
  }
  #choices { margin-top: 1.5rem; }
  a.home-link { display: inline-block; margin-top: 1rem; }
</style>
</head>
<body>

<h1>KidsTown City Park - Your Big Journey</h1>
<hr>

<div id="intro">
  <p id="introText">Hello, and welcome to the KidsTown City Park. You are about to go on a
  big journey through the park. Type in your first name, then click
  "Let's Go!!" to get started.</p>
  <form id="nameForm">
    <input type="text" id="nameInput" size="10" placeholder="Your name">
    <button type="submit">Let's Go !!</button>
  </form>
</div>

<div id="story" style="display:none;">
  <h2 id="storyTitle"></h2>
  <blockquote id="storyText"></blockquote>
  <div id="choices"></div>
  <button id="backBtn" type="button">Back</button>
  <button id="restartBtn" type="button" style="display:none;">Start a new journey</button>
</div>

<!--
  c_park.js (converted from scripts/citypark/main.pl + page.pl) fetches
  citypark.json and drives everything above. No inline story data here
  anymore — see c_park.js / citypark.json for the actual content and logic.
-->
<script src="c_park.js"></script>

</body>
</html>
