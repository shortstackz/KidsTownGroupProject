<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KidsTown Museum — Planetarium</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #000;
    color: #fff;
    text-align: center;
    max-width: 700px;
    margin: 2rem auto;
    padding: 0 1.25rem 3rem;
  }
  h1 { font-size: 1.5rem; }
  #tourSelect button {
    font-size: 1.1rem;
    padding: 0.75rem 1.5rem;
    margin: 0.5rem;
    cursor: pointer;
    background: #222;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 6px;
  }
  #tourSelect button:hover { background: #444; }
  #question {
    font-size: 1.25rem;
    margin: 1.5rem 0;
  }
  #answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .answer-btn {
    background: #111;
    border: 2px solid #555;
    border-radius: 8px;
    padding: 0.75rem;
    cursor: pointer;
    color: #fff;
    font-size: 0.95rem;
  }
  .answer-btn img {
    max-width: 100%;
    height: 90px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }
  .answer-btn:hover { border-color: #FFD700; }
  .answer-btn.correct { border-color: #4C9A6B; background: #123; }
  .answer-btn.incorrect { border-color: #C1443B; background: #300; }
  #feedback {
    margin-top: 1.25rem;
    font-size: 1.05rem;
    min-height: 3rem;
  }
  #nextBtn, #restartBtn {
    font-size: 1rem;
    padding: 0.6rem 1.25rem;
    margin-top: 1rem;
    cursor: pointer;
    display: none;
  }
  #score { margin-top: 1.5rem; color: #FFD700; }
</style>
</head>
<body>

<h1>Thank you for visiting the Planetarium</h1>

<div id="tourSelect">
  <p>Please select a tour of our Solar System:</p>
  <button data-tour="basic">Basic Tour</button>
  <button data-tour="advanced">Advanced Tour</button>
</div>

<div id="quiz" style="display:none;">
  <div id="question"></div>
  <div id="answers"></div>
  <div id="feedback"></div>
  <button id="nextBtn">Next Question →</button>
  <div id="score"></div>
</div>

<div id="done" style="display:none;">
  <h2>You've completed the tour!</h2>
  <p id="finalScore"></p>
  <button id="restartBtn" style="display:inline-block;">Choose another tour</button>
</div>

<script src="museum.js"></script>

</body>
</html>
